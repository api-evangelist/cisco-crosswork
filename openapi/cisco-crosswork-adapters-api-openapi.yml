openapi: 3.2.0
info:
  description: Cisco Crosswork Workflow Manager (CWM) 2.1 offers RESTful APIs that enable automation engineers and developers to create, deploy, and manage workflows, adapters, jobs, resources, events, and workers within the Cisco CWM platform.
  title: Cisco Crosswork Workflow Manager Adapters API
  termsOfService: www.cisco.com
  contact:
    name: API Support
    url: https://www.cisco.com/support
  version: 2.1.0
  x-provenance:
    method: harvested
    authored_by: Cisco Crosswork
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    note: 'Reconstructed verbatim from the per-operation Swagger 2.0 JSON fragments Cisco serves for the Crosswork Workflow Manager API reference at developer.cisco.com/docs/crosswork/workflow-manager/. info, basePath and securityDefinitions are Cisco''s own meta block; each path/method object is Cisco''s own spec object, unmodified except that inline schemas carrying the swagger-ui $$ref marker were hoisted back into #/definitions and replaced with a real $ref.'
servers:
- url: /crosswork/cwm/v2
tags:
- name: Adapters
paths:
  /adapter:
    get:
      description: Retrieve a list of all adapters uploaded to the system for use in workflows.
      tags:
      - Adapters
      summary: List all uploaded adapters
      operationId: list_adapters
      responses:
        '200':
          description: Adapters retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/server.listAdaptersAdapterResponse'
        '204':
          description: No adapters found.
          content:
            application/json:
              schema:
                type: string
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: list-adapters
      method: get
      path: /adapter
    post:
      description: Upload a new adapter file (.tar.gz format) to the system for future deployment as a plugin.
      tags:
      - Adapters
      summary: Upload a new adapter
      operationId: file_upload
      responses:
        '201':
          description: Adapter uploaded successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: file.upload
      method: post
      path: /adapter
      requestBody:
        content:
          application/x-gzip:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The adapter file to upload (.tar.gz).
                  format: binary
              required:
              - file
  /adapter/{adapterId}:
    delete:
      description: Delete an adapter from the system using its ID.
      tags:
      - Adapters
      summary: Delete an adapter
      operationId: delete_adapter
      parameters:
      - description: Adapter ID.
        name: adapterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Adapter deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '204':
          description: No adapter found to delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Adapter not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: delete-adapter
      method: delete
      path: /adapter/{adapterId}
    get:
      description: Retrieve details for a specific adapter by ID.
      tags:
      - Adapters
      summary: Get adapter details
      operationId: get_adapter
      parameters:
      - description: Adapter ID.
        name: adapterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Adapter details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.getAdapterResponse'
        '204':
          description: No adapter found with the specified ID.
          content:
            application/json:
              schema:
                type: string
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: get-adapter
      method: get
      path: /adapter/{adapterId}
    patch:
      description: Partially update an adapter's configuration using a JSON payload.
      tags:
      - Adapters
      summary: Partially update an adapter
      operationId: patch_adapter
      parameters:
      - description: Adapter ID.
        name: adapterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Adapter partially updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Adapter not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: patch-adapter
      method: patch
      path: /adapter/{adapterId}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.patchAdapterRequest'
        description: Partial adapter update payload.
        required: true
    put:
      description: Replace an existing adapter file with a new uploaded version (.tar.gz).
      tags:
      - Adapters
      summary: Update an adapter file
      operationId: update_adapter
      parameters:
      - description: Adapter ID.
        name: adapterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Adapter updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Adapter not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: update-adapter
      method: put
      path: /adapter/{adapterId}
      requestBody:
        content:
          application/x-gzip:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Updated adapter file (.tar.gz).
                  format: binary
              required:
              - file
  /adapter/{adapterId}/deploy:
    post:
      description: Creates plugin.
      tags:
      - Adapters
      summary: Create plugin with uploaded adapter file
      operationId: deploy_adapter
      parameters:
      - description: Adapter ID
        name: adapterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: deploy-adapter
      method: post
      path: /adapter/{adapterId}/deploy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.createPluginsRequest'
        description: create worker
        required: true
components:
  schemas:
    server.listAdaptersAdapterResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/server.getAdapterActivityResponse'
        adapterId:
          type: string
        createdAt:
          type: string
        cwmVersionId:
          type: string
        defaultStatus:
          type: boolean
        deployedStatus:
          type: boolean
        description:
          type: string
        hashSum:
          type: string
        inUseStatus:
          type: boolean
        product:
          type: string
        resourceTypeId:
          type: string
        updatedAt:
          type: string
        uploadedStatus:
          type: boolean
        vendor:
          type: string
        verified:
          type: boolean
        version:
          type: string
    server.getAdapterActivityResponse:
      type: object
      properties:
        adapterId:
          type: string
        description:
          type: string
        id:
          type: string
        inputSchema:
          type: array
          items:
            type: integer
        name:
          type: string
        outputSchema:
          type: array
          items:
            type: integer
        packageName:
          type: string
    server.patchAdapterRequest:
      type: object
      properties:
        defaultStatus:
          type: boolean
    server.getAdapterResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/server.getAdapterActivityResponse'
        adapterId:
          type: string
        createdAt:
          type: string
        cwmVersionId:
          type: string
        defaultStatus:
          type: boolean
        deployedStatus:
          type: boolean
        description:
          type: string
        hashSum:
          type: string
        inUseStatus:
          type: boolean
        product:
          type: string
        resourceTypeId:
          type: string
        updatedAt:
          type: string
        uploadedStatus:
          type: boolean
        vendor:
          type: string
        verified:
          type: boolean
        version:
          type: string
    server.HTTPError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: status bad request
    server.createPluginsRequest:
      type: object
      properties:
        createWorker:
          type: boolean
        defaultStatus:
          type: boolean
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
