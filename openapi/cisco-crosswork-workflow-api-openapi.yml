openapi: 3.2.0
info:
  description: Cisco Crosswork Workflow Manager (CWM) 2.1 offers RESTful APIs that enable automation engineers and developers to create, deploy, and manage workflows, adapters, jobs, resources, events, and workers within the Cisco CWM platform.
  title: Cisco Crosswork Manager Workflow API
  termsOfService: www.cisco.com
  contact:
    name: API Support
    url: https://www.cisco.com/support
  version: 2.1.0
  x-provenance:
    method: harvested
    authored_by: Cisco Crosswork
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    note: 'Reconstructed verbatim from the per-operation Swagger 2.0 JSON fragments Cisco serves for the Crosswork Workflow Manager API reference at developer.cisco.com/docs/crosswork/workflow-manager/. info, basePath and securityDefinitions are Cisco''s own meta block; each path/method object is Cisco''s own spec object, unmodified except that inline schemas carrying the swagger-ui $$ref marker were hoisted back into #/definitions and replaced with a real $ref.'
servers:
- url: /crosswork/cwm/v2
tags:
- name: Workflow
paths:
  /workflow:
    get:
      description: Retrieve a list of workflows from the application's database, optionally filtered by tags.
      tags:
      - Workflow
      summary: List workflows
      operationId: list_workflows
      parameters:
      - description: Tags to filter workflows.
        name: tags
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Workflows retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.Workflow'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: list-workflows
      method: get
      path: /workflow
    post:
      description: Add a new workflow to the application database.
      tags:
      - Workflow
      summary: Add a new workflow
      operationId: create_workflow
      responses:
        '200':
          description: Workflow UUID generated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: create-workflow
      method: post
      path: /workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.WorkflowAttributes'
        description: Workflow details to add.
        required: true
  /workflow/name/{workflowName}/version/{workflowVersion}:
    delete:
      description: Delete a specific workflow by its name and version from the application database.
      tags:
      - Workflow
      summary: Delete a workflow by name and version
      operationId: delete_workflow_by_name_version
      parameters:
      - description: Workflow name.
        name: workflowName
        in: path
        required: true
        schema:
          type: string
      - description: Workflow version.
        name: workflowVersion
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: delete-workflow-by-name-version
      method: delete
      path: /workflow/name/{workflowName}/version/{workflowVersion}
    get:
      description: Retrieve a specific workflow by its name and version from the application database.
      tags:
      - Workflow
      summary: Get a workflow by name and version
      operationId: get_workflow_by_name_version
      parameters:
      - description: Workflow name.
        name: workflowName
        in: path
        required: true
        schema:
          type: string
      - description: Workflow version.
        name: workflowVersion
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.WorkflowGetResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: get-workflow-by-name-version
      method: get
      path: /workflow/name/{workflowName}/version/{workflowVersion}
    put:
      description: Update an existing workflow by its name and version in the application database.
      tags:
      - Workflow
      summary: Update a workflow by name and version
      operationId: update_workflow_by_name_version
      parameters:
      - description: Workflow name.
        name: workflowName
        in: path
        required: true
        schema:
          type: string
      - description: Workflow version.
        name: workflowVersion
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: update-workflow-by-name-version
      method: put
      path: /workflow/name/{workflowName}/version/{workflowVersion}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.WorkflowAttributes'
        description: Updated workflow details.
        required: true
  /workflow/name/{workflowName}/version/{workflowVersion}/validateInputData:
    post:
      description: Validate whether the input data provided is valid for the specified workflow.
      tags:
      - Workflow
      summary: Validate workflow input data
      operationId: validate_workflow_input
      parameters:
      - description: Workflow name.
        name: workflowName
        in: path
        required: true
        schema:
          type: string
      - description: Workflow version.
        name: workflowVersion
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Input data validation successful.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: validate-workflow-input
      method: post
      path: /workflow/name/{workflowName}/version/{workflowVersion}/validateInputData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.InputSchemaVadation'
        description: Input data to validate.
        required: true
  /workflow/tags:
    get:
      description: Retrieve a list of all workflow tags from the application database.
      tags:
      - Workflow
      summary: List all workflow tags
      operationId: list_workflow_tags
      responses:
        '200':
          description: Workflow tags retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: list-workflow-tags
      method: get
      path: /workflow/tags
  /workflow/validate:
    post:
      description: Validate whether a workflow definition is valid.
      tags:
      - Workflow
      summary: Validate a workflow
      operationId: validate_workflow
      responses:
        '200':
          description: Workflow validation successful.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: validate-workflow
      method: post
      path: /workflow/validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.WorkflowDefinition'
        description: Workflow definition to validate.
        required: true
  /workflow/{workflowId}:
    delete:
      description: Delete a workflow from the application database by its UUID.
      tags:
      - Workflow
      summary: Delete a workflow by UUID
      operationId: delete_workflow
      parameters:
      - description: Workflow UUID.
        name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: delete-workflow
      method: delete
      path: /workflow/{workflowId}
    get:
      description: Retrieve a workflow from the application database by its UUID.
      tags:
      - Workflow
      summary: Get a workflow by UUID
      operationId: get_workflow_by_id
      parameters:
      - description: Workflow UUID.
        name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.WorkflowGetResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: get-workflow-by-id
      method: get
      path: /workflow/{workflowId}
    put:
      description: Update an existing workflow in the application database by its UUID.
      tags:
      - Workflow
      summary: Update a workflow by UUID
      operationId: update_workflow_by_id
      parameters:
      - description: Workflow UUID.
        name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workflow updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: update-workflow-by-id
      method: put
      path: /workflow/{workflowId}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.WorkflowAttributes'
        description: Updated workflow details.
        required: true
  /workflowExport:
    post:
      description: Export workflow definitions using name and version. An empty request body exports all workflows.
      tags:
      - Workflow
      summary: Export workflow definitions
      operationId: export_workflows
      responses:
        '200':
          description: Workflows exported successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.Workflow'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: export-workflows
      method: post
      path: /workflowExport
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/repository.NameVersion'
        description: Workflow export request details.
        required: true
  /workflowImport:
    post:
      description: Import workflows into the application database.
      tags:
      - Workflow
      summary: Import workflow definitions
      operationId: import_workflows
      responses:
        '200':
          description: Workflows imported successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: import-workflows
      method: post
      path: /workflowImport
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/server.WorkflowAttributes'
        description: Workflow definitions to import.
        required: true
components:
  schemas:
    models.Workflow:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        definition:
          type: object
        description:
          type: string
        formId:
          type: string
        hashSum:
          type: string
        name:
          type: string
        path:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
        wfTags:
          type: array
          items:
            type: string
        workflowId:
          type: string
          format: uuid
    server.WorkflowAttributes:
      type: object
      properties:
        definition:
          type: object
        formId:
          type: string
        path:
          type: string
        wfTags:
          type: array
          items:
            type: string
    server.InputSchemaVadation:
      type: object
      properties:
        data:
          type: object
    server.WorkflowGetResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/models.Workflow'
    repository.NameVersion:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
        version:
          type: string
    server.WorkflowDefinition:
      type: object
      properties:
        definition:
          type: object
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
