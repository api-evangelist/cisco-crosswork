servers:
- url: /crosswork/cwm/v2
tags:
- name: Secrets
paths:
  /secret:
    get:
      description: Retrieve a list of all available secrets stored in the system.
      tags:
      - Secrets
      summary: List all secrets
      operationId: list_secrets
      responses:
        '200':
          description: Secrets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.SecretList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: list-secrets
      method: get
      path: /secret
    post:
      description: Add a new secret to the secret store.
      tags:
      - Secrets
      summary: Add a new secret
      operationId: create_secret
      responses:
        '201':
          description: Secret created successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: create-secret
      method: post
      path: /secret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.SecretAddRequest'
        description: Secret to add to the store.
        required: true
  /secret/{secretId}:
    delete:
      description: Delete a specific secret from the database using its ID.
      tags:
      - Secrets
      summary: Delete a secret by ID
      operationId: delete_secret
      parameters:
      - description: Secret ID.
        name: secretId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: delete-secret
      method: delete
      path: /secret/{secretId}
    get:
      description: Retrieve the details of a specific secret by its ID.
      tags:
      - Secrets
      summary: Get a specific secret by ID
      operationId: get_secret
      parameters:
      - description: Secret ID.
        name: secretId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.SecretGetResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: get-secret
      method: get
      path: /secret/{secretId}
    patch:
      description: Update an existing secret’s payload.
      tags:
      - Secrets
      summary: Update a secret
      operationId: update_secret
      parameters:
      - description: Secret ID.
        name: secretId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secret updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: update-secret
      method: patch
      path: /secret/{secretId}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.SecretUpdateRequest'
        description: Secret update payload.
        required: true
  /secretType:
    get:
      description: Retrieve a list of all available secret types.
      tags:
      - Secrets
      summary: List all secret types
      operationId: list_secret_types
      responses:
        '200':
          description: Secret types retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.SecretTypeListResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: string
      __originalOperationId: list-secret-types
      method: get
      path: /secretType
  /secretType/{secretTypeId}:
    get:
      description: Retrieve a list of secrets associated with a specific secret type.
      tags:
      - Secrets
      summary: List secrets by secret type
      operationId: get_secret_type
      parameters:
      - description: Secret Type ID.
        name: secretTypeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secrets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.SecretList'
        '404':
          description: Secret type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: get-secret-type
      method: get
      path: /secretType/{secretTypeId}
