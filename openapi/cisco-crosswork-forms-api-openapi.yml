servers:
- url: /crosswork/cwm/v2
tags:
- name: Forms
paths:
  /form:
    get:
      description: Retrieve a list of all available forms.
      tags:
      - Forms
      summary: List available forms
      operationId: list_forms
      responses:
        '200':
          description: Forms retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.CallbackForm'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Forms not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: list-forms
      method: get
      path: /form
    post:
      description: Create a new form with the specified input data.
      tags:
      - Forms
      summary: Create a new form
      operationId: create_form
      responses:
        '200':
          description: Form created successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Forms service not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: create-form
      method: post
      path: /form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.formSchema'
        description: Form input data.
        required: true
  /form/{formId}:
    delete:
      description: Delete a specific form by its ID.
      tags:
      - Forms
      summary: Delete a form
      operationId: delete_form
      parameters:
      - description: Form ID.
        name: formId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Form deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Form not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: delete-form
      method: delete
      path: /form/{formId}
    get:
      description: Retrieve a specific form by its ID.
      tags:
      - Forms
      summary: Get a specific form
      operationId: get_form
      parameters:
      - description: Form ID.
        name: formId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Form retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.CallbackForm'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Form not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: get-form
      method: get
      path: /form/{formId}
    patch:
      description: Update an existing form with new data.
      tags:
      - Forms
      summary: Update a specific form
      operationId: update_form
      parameters:
      - description: Form ID.
        name: formId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Form updated successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Form not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: update-form
      method: patch
      path: /form/{formId}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.formSchema'
        description: Updated form input.
        required: true
  /formExport:
    post:
      description: Export a list of forms. Providing an empty body exports all available forms.
      tags:
      - Forms
      summary: Export forms
      operationId: export_forms
      responses:
        '200':
          description: Forms exported successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.CallbackForm'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Forms not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: export-forms
      method: post
      path: /formExport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server.FormExport'
        description: List of form IDs to export.
        required: true
  /formImport:
    post:
      description: Import a list of forms into the system.
      tags:
      - Forms
      summary: Import forms
      operationId: import_forms
      responses:
        '200':
          description: Forms imported successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
          description: Forms service not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: import-forms
      method: post
      path: /formImport
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/server.formSchema'
        description: List of form inputs to import.
        required: true
components:
  schemas:
    models.CallbackForm:
      type: object
      properties:
        createdAt:
          type: string
        description:
          type: string
        dynamicContentSchema:
          type: array
          items:
            type: integer
        formId:
          type: string
        formSchema:
          type: array
          items:
            type: integer
        name:
          type: string
        updatedAt:
          type: string
    server.HTTPError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: status bad request
    server.FormExport:
      type: object
      properties:
        formIds:
          type: array
          items:
            type: string
    server.formSchema:
      type: object
      properties:
