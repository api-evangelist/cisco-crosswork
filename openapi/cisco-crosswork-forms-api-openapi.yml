        dynamicContentSchema:
          type: object
        formId:
          type: string
        formSchema:
          type: object
        name:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
