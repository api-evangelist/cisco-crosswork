      description: Delete a specific task by its ID.
      tags:
      - Tasks
      summary: Delete a task by ID
      operationId: delete_task
      parameters:
      - description: Task ID.
        name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task deleted successfully.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '404':
