          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.HTTPError'
      __originalOperationId: delete-task
      method: delete
      path: /task/{taskId}
    get:
      description: Retrieve detailed information about a specific task by its ID.
      tags:
      - Tasks
      summary: Get a specific task by ID
      operationId: get_task
      parameters:
      - description: Task ID.
        name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
