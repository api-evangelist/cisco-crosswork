paths:
  /v1/alerts:
    get:
      summary: Get Alerts from Crosswork Platform
      operationId: GetAlerts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/robotctl_apiAlertResponse'
      tags:
      - Alert API
components:
  schemas:
    robotctl_apiAlertCount:
      type: object
      properties:
        Minor:
          type: integer
          format: int32
        Major:
          type: integer
          format: int32
        Critical:
          type: integer
          format: int32
    robotctl_apiAlertResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/robotctl_apiAlertCount'
        AlertMap:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/robotctl_apiAlertList'
    robotctl_apiAlertMsg:
      type: object
      properties:
        AlertMsg:
          type: string
        AlertAction:
          type: string
        ActionLink:
          type: boolean
          format: boolean
        ActionLinkMsg:
          type: string
        Priority:
          $ref: '#/components/schemas/robotctl_apiAlertPriority'
    robotctl_apiAlertList:
      type: object
      properties:
        List:
          type: array
          items:
            $ref: '#/components/schemas/robotctl_apiAlertMsg'
    robotctl_apiAlertPriority:
      type: string
      enum:
      - MINOR
      - MAJOR
      - CRITICAL
      default: MINOR
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
