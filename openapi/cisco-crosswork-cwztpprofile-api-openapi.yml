tags:
- name: cwztpprofile
paths:
  /v1/profiles:
    delete:
      summary: Delete the individual Profiles from Ztp.
      operationId: DeleteProfile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwztpsvcZtpProfileResponse'
      tags:
      - cwztpprofile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwztpsvcZtpProfileRequest'
        required: true
    post:
      summary: 'PostProfiles API Add the bulk of Ztp profiles Request Body: ZtpProfileList…'
      operationId: SetProfiles
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwztpsvcZtpProfileResponse'
      tags:
      - cwztpprofile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwztpsvcZtpProfileList'
        required: true
    put:
      summary: Update the individual profile.
      operationId: UpdateProfile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwztpsvcZtpProfileResponse'
      tags:
      - cwztpprofile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwztpsvcZtpProfile'
        required: true
  /v1/profiles/query:
    post:
      summary: GetProfile API Retrieves a list of profiles.
      operationId: GetProfileList
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwztpsvcZtpProfileResponse'
      tags:
      - cwztpprofile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwztpsvcZtpProfileRequest'
        required: true
components:
  schemas:
    cwztpsvcZtpFilterData:
      type: object
      properties:
        SortBy:
          type: string
        PageSize:
          type: integer
          format: int64
        PageNum:
          type: integer
          format: int64
        Descending:
          type: boolean
          format: boolean
        MatchCase:
          type: boolean
          format: boolean
        Criteria:
          type: string
        TotalCount:
          type: integer
          format: int64
    cwztpsvcZtpProfile:
      type: object
      properties:
        profileId:
          type: string
          title: unique ID of Profile
        profileName:
          type: string
        profileDescription:
          type: string
        osPlatform:
          type: string
          title: OS Platform of Image and Config
        deviceFamily:
          type: string
          title: Device Family of Image and Config
        version:
          type: string
          title: Version of Image and Config
        image:
          type: string
          title: unique ID of Image
        config:
          type: string
          title: unique ID of Config
        lastUpdated:
          type: string
          format: int64
        imageName:
          type: string
        configName:
          type: string
        isImageInvalid:
          type: boolean
          format: boolean
          title: flag to check if ZTP Profile is in sync with Image
        isConfigInvalid:
          type: boolean
          format: boolean
          title: flag to check if ZTP Profile is in sync with Config
    cwztpsvcZtpProfileRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/cwztpsvcZtpProfile'
        criteria:
          type: string
        filterData:
          $ref: '#/components/schemas/cwztpsvcZtpFilterData'
    cwztpsvcZtpProfileList:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/cwztpsvcZtpProfile'
    cwztpsvcZtpProfileResponse:
      type: object
      properties:
        ztpProfiles:
          type: array
          items:
            $ref: '#/components/schemas/cwztpsvcZtpProfile'
        code:
          type: integer
          format: int32
        message:
          type: string
        paginationDetails:
          $ref: '#/components/schemas/cwztpsvcZtpFilterData'
