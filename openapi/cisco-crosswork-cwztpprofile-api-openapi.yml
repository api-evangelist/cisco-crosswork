          title: unique ID of Config
        lastUpdated:
          type: string
          format: int64
        imageName:
          type: string
        configName:
          type: string
        isImageInvalid:
          type: boolean
          format: boolean
          title: flag to check if ZTP Profile is in sync with Image
        isConfigInvalid:
          type: boolean
          format: boolean
          title: flag to check if ZTP Profile is in sync with Config
    cwztpsvcZtpProfileResponse:
