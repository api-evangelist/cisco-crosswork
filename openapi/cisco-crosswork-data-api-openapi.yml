                      description: Link flags (leaf-list)
                      type: string
                      format: identityref
                  ietf-l3-unicast-topology-state:metric1:
                    description: Link Metric 1 (leaf)
                    x-yang:
                      type: leaf
                    type: integer
                    format: uint64
