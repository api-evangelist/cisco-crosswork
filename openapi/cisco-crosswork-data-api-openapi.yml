                    format: leafref
                  ietf-network-topology-state:source-tp:
                    description: 'This termination point is located within the source node

                      and terminates the link. (leaf)'
                    x-yang:
                      type: leaf
                    type: string
                    format: leafref
              ietf-network-topology-state:destination:
                description: 'This container holds the logical destination of a

                  particular link. (non-presence)'
                type: object
                x-yang:
                  type: container
                  is_presence: 'false'
                properties:
                  ietf-network-topology-state:dest-node:
                    description: 'Destination node identifier.  Must be in the same

                      network. (leaf)'
                    x-yang:
                      type: leaf
                    type: string
                    format: leafref
                  ietf-network-topology-state:dest-tp:
                    description: 'This termination point is located within the

                      destination node and terminates the link. (leaf)'
                    x-yang:
                      type: leaf
                    type: string
                    format: leafref
              ietf-network-topology-state:link-id:
                description: 'The identifier of a link in the topology.

                  A link is specific to a topology to which it belongs. (leaf)'
                x-yang:
                  type: leaf
                type: string
                format: string
              ietf-network-topology-state:supporting-link:
                type: array
                description: Identifies the link or links on which this link depends. (list)
                x-yang:
                  type: list
                items:
                  type: object
                  properties:
                    ietf-network-topology-state:network-ref:
                      description: 'This leaf identifies in which underlay topology

