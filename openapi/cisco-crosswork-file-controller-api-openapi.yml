openapi: 3.2.0
info:
  title: Crosswork ZTP Image Service File Controller API
  version: 2.0.0
  contact:
    name: Crosswork Team, Cisco
    email: support@cisco.com
  license:
    name: Cisco Software License Agreement
    url: http://www.cisco.com/public/sw-license-agreement.html
  description: This document details the Crosswork REST APIs that you can use to manage software image files for Zero Touch Provisioning (ZTP) devices.
  x-provenance:
    method: harvested
    authored_by: Cisco Crosswork
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    note: Published by Cisco. Retrieved unmodified except for this x-provenance block.
    provider_published: true
  x-evidence:
  - type: source
    url: https://github.com/CiscoDevNet/crosswork-openapi-spec/blob/master/ZTP/2.0APIs/cw_image_service.swagger.json
  - type: raw
    url: https://raw.githubusercontent.com/CiscoDevNet/crosswork-openapi-spec/master/ZTP/2.0APIs/cw_image_service.swagger.json
servers:
- url: /crosswork/imagesvc/
security:
- bearerAuth: []
tags:
- name: file-controller
  description: File Controller
paths:
  /v1/device/files/{id}:
    get:
      tags:
      - file-controller
      summary: Download image file by ID from device
      operationId: downloadImageFromDeviceByImageIdUsingGET
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: X-cisco-serial*
        in: header
        description: X-cisco-serial*
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK. The request was successful. The result is contained in the response body.
        '401':
          description: Unauthorized. The request has not been applied because it lacks valid authentication credentials for the target resource.
        '403':
          description: Forbidden. The server recognizes the authentication credentials, but the client is not authorized to perform this request.
        '404':
          description: Not Found. The client made a request for a resource that does not exist.
  /v1/device/image/download/{token}/{name}:
    get:
      tags:
      - file-controller
      summary: Download image file by a token(random ID) from device
      operationId: downloadImageFromDeviceByRandomIdUsingGET
      parameters:
      - name: token
        in: path
        description: token
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. The request was successful. The result is contained in the response body.
        '401':
          description: Unauthorized. The request has not been applied because it lacks valid authentication credentials for the target resource.
        '403':
          description: Forbidden. The server recognizes the authentication credentials, but the client is not authorized to perform this request.
        '404':
          description: Not Found. The client made a request for a resource that does not exist.
  /v1/files/{id}:
    get:
      tags:
      - file-controller
      summary: Download image file by ID
      operationId: downloadImageByImageIdUsingGET
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. The request was successful. The result is contained in the response body.
        '401':
          description: Unauthorized. The request has not been applied because it lacks valid authentication credentials for the target resource.
        '403':
          description: Forbidden. The server recognizes the authentication credentials, but the client is not authorized to perform this request.
        '404':
          description: Not Found. The client made a request for a resource that does not exist.
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
