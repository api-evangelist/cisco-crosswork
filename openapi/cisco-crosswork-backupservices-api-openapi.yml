          type: integer
          format: int32
        username:
          type: string
        password:
          type: string
        remotePath:
          type: string
    backupGetJobsResult:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/backupGetJobResult'
    backupRequestVMBackupRestoreJobNamesOp:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/backupRequestVMBackupRestoreJobNameOp'
    backupBackupVerifyOpResult:
      type: object
      properties:
        warnings:
          type: array
          items:
            type: string
    backupBackupOpResult:
      type: object
      properties:
        jobId:
          type: string
    backupGetTasksResult:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/backupGetTaskResult'
    backupGetTaskResult:
      type: object
      properties:
        taskId:
          type: string
        taskName:
          type: string
        jobId:
          type: string
        timeInitiated:
          type: string
        timeCompleted:
          type: string
        status:
          type: string
    backupMigrationOpReq:
      type: object
      properties:
        filename:
          type: string
        force:
          type: boolean
          format: boolean
    backupBackUpOpReq:
      type: object
      properties:
        jobName:
          type: string
        force:
          type: boolean
          format: boolean
        nsoBackupDisable:
          type: boolean
          format: boolean
    backupGetJobResult:
      type: object
      properties:
        jobId:
          type: string
        jobName:
          type: string
        jobType:
          type: string
        timeInitiated:
          type: string
        lastCompletedAction:
          type: string
        currentActionInProgress:
          type: string
        timeCompleted:
          type: string
        status:
          type: string
        backupJobId:
          type: string
        backupJobName:
          type: string
        error:
          type: string
