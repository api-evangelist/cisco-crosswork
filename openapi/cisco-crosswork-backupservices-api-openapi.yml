      type: object
      properties:
        filter:
          $ref: '#/components/schemas/backupGetJobsReqFilter'
        filterData:
          $ref: '#/components/schemas/backupGetJobsReqPageFilter'
    backupRequestVMBackupRestoreJobNameOp:
      type: object
      properties:
        jobId:
          type: string
        jobName:
          type: string
    backupGetJobsReqPageFilter:
      type: object
      properties:
        status:
          type: string
        jobType:
          type: string
        jobName:
          type: string
    backupRestoreOpReq:
      type: object
      properties:
        jobName:
          type: string
        backupJobName:
          type: string
        force:
          type: boolean
          format: boolean
    backupGetJobsReqFilter:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
        pageNum:
          type: integer
          format: int32
    backupRestoreVerifyOpReq:
      type: object
      properties:
        backupJobName:
          type: string
        force:
          type: boolean
          format: boolean
    backupDisasterRestoreOpReq:
      type: object
      properties:
        filename:
          type: string
        force:
          type: boolean
          format: boolean
    backupRequestVMBackupRemoteLocationOp:
      type: object
      properties:
        hostName:
          type: string
