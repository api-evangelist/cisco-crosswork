  highlights:
  - Multiple Segment Lists (MSL) integrated into Local Congestion Mitigation.
  - High interface density support for ASR 9000.
  - Single-VM deployment option for smaller environments.
  - Automated Geo HA onboarding and closed-loop automation.
  - Fleet upgrade and golden configuration management workflows.
  api_note: >-
    The one API-adjacent change called out is an NSO RESTCONF integration fix: Crosswork's calls to the NSO
    service-state-changes RESTCONF API could leave sessions hanging until NSO ran out of sessions, and the remedy is
    a keepalive setting in ncs.conf on the NSO side — a change to the operator's configuration, not to the contract.
