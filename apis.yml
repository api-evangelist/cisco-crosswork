aid: cisco-crosswork
name: Cisco Crosswork
description: 'Cisco Crosswork is Cisco''s service-provider network automation portfolio — Crosswork Network Controller,
  Data Gateway, Zero Touch Provisioning, Optimization Engine and Network Change Automation. Unusually for Cisco,
  the specifications are published openly: the CiscoDevNet/crosswork-openapi-spec repository carries more than a
  hundred Swagger documents across the CNC, CDG, ZTP, COE and NCAHI components and multiple product versions, including
  IETF L2VPN/L3VPN and traffic-engineering service models.'
