aid: cisco-crosswork
name: Cisco Crosswork
description: 'Cisco Crosswork is Cisco''s service-provider network automation portfolio — Crosswork Network Controller,
  Data Gateway, Zero Touch Provisioning, Optimization Engine, Network Change Automation and Crosswork Workflow Manager.
  Unusually for Cisco, the specifications are published openly: the CiscoDevNet/crosswork-openapi-spec repository carries
  more than a hundred Swagger documents across the CNC, CDG, ZTP, COE and NCAHI components and multiple product versions,
  including IETF L2VPN/L3VPN and traffic-engineering service models, and Cisco publishes a further 90-operation Swagger
  contract for Crosswork Workflow Manager 2.1 behind its DevNet reference renderer. That CWM contract includes a first-party
  Model Context Protocol endpoint. Crosswork is customer-deployed software: every base URL is a path on a host the operator
  installs, and there is no Cisco-hosted endpoint, no published price and no rate limit.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-crosswork/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: cisco
x-relationship: product
x-contract-status: real
x-contract-note: Cisco publishes fetchable first-party specifications for this API. The CNC/CDG/ZTP/COE/NCAHI Swagger
  documents were harvested from CiscoDevNet/crosswork-openapi-spec; the Crosswork Workflow Manager 2.1 contract was reconstructed
  from the per-operation Swagger fragments Cisco serves at pubhub.devnetcloud.com. Both carry an x-provenance stamp in
  openapi/_original/.
