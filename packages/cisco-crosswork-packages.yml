generated: '2026-08-19'
method: searched
source: https://github.com/CiscoDevNet/Crosswork-SDK
note: >-
  Cisco ships no Crosswork client library to any public package registry. npm, PyPI, Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist and crates.io were all queried for crosswork / cisco-crosswork / crosswork-sdk and
  every one returned 404 (proxy.golang.org answered 200 with an empty version list, which is the same finding).
  What Cisco does publish is the CiscoDevNet/Crosswork-SDK repository: a set of downloadable, version-directoried
  development tools — Java notification-client JARs, a Java/Python service-extensibility SDK, the Data Platform
  Model protobufs and the RESTCONF YANG models. These are distributed as files in a git repository, not as registry
  artifacts, so there is no registry metadata endpoint to read a version from; the version is the directory name
  Cisco publishes them under, and `published` is the date of the last commit that touched that path.
registry_probes:
- registry: npm
  queries: [crosswork, cisco-crosswork, '@cisco/crosswork']
  result: 404 on all
- registry: pypi
  queries: [crosswork, cisco-crosswork, crosswork-sdk, cwm-sdk]
  result: 404 on all
- registry: go
  queries: [github.com/ciscodevnet/crosswork-sdk]
  result: 200 with an empty @v/list (no module published)
