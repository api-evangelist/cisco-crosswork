summary: >-
  Two largely independent object graphs live inside Crosswork. The INVENTORY graph models the managed network —
  devices, the credentials and providers used to reach them, the tags that group them, and the data-gateway
  enrolments and destinations that carry their telemetry. The WORKFLOW graph models automation — workflows and
  their versions, the jobs and runs that execute them, the adapters that give them capabilities, and the workers,
  resources and secrets they run against. They meet only at the operational level, not in the contract: no schema
  in the Workflow Manager document references a device, and no inventory schema references a workflow.
id_style:
  format: opaque string identifiers, no type prefix
  note: >-
    Crosswork ids carry no domain prefix (nothing like `wf_` or `dev_`). The type is conveyed by the FIELD NAME
    (adapterId, workflowId, resourceId, secretId, jobId, runId), not by the value, so an id lifted out of its
    context is untypeable.
  composite_keys:
  - entity: workflow
    key: [workflowName, workflowVersion]
    note: >-
      Workflows are addressable two ways — by UUID (/workflow/{workflowId}) and by name+version
      (/workflow/name/{workflowName}/version/{workflowVersion}). Both are first-class in the contract, with
      parallel GET/PUT/DELETE operations.
